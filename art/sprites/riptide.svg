<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"
     viewBox="0 0 128 128" shape-rendering="crispEdges">
  <defs>
    <!-- Helmet, night-vision goggles, face covering and tactical vest -->
    <g id="core">
      <path fill="#0c1420" d="M10 11h4v-1h9v1h3v9h-2v2H12v-2h-2z"/>
      <path fill="#172438" d="M12 12h3v7h-2v2h-1z M22 12h2v7h-2z"/>
      <path fill="#27364a" d="M15 12h6v7h-6z"/>
      <path fill="#0a1019" d="M14 14h8v4h-8z"/>
      <path fill="#182333" d="M12 17h12v2H12z"/>
      <path fill="#46505a" d="M13 12h2v2h-2z M21 13h2v1h-2z"/>
      <path fill="#0c1420" d="M13 4h9v1h2v5h-2v2h-9v-2h-2V6h2z"/>
      <path fill="#27364a" d="M14 5h7v1h2v3h-2v1h-7V9h-1V6h1z"/>
      <path fill="#111b28" d="M12 6h12v2H12z"/>
      <!-- Four green night-vision lenses -->
      <path fill="#07130f" d="M15 8h2v3h-2z M18 8h2v3h-2z M21 8h2v3h-2z"/>
      <path fill="#37a867" d="M15 8h1v2h-1z M18 8h1v2h-1z M21 8h1v2h-1z"/>
      <path fill="#9af5a5" d="M15 8h1v1h-1z M18 8h1v1h-1z M21 8h1v1h-1z"/>
      <!-- Helmet strap and radio -->
      <path fill="#111923" d="M12 10h2v3h-2z M23 11h2v4h-2z"/>
      <path fill="#45515d" d="M24 12h2v3h-2z"/>
    </g>

    <!-- Pants and boots -->
    <g id="legs">
      <path fill="#101a28" d="M12 20h5v5h-1v4h-2v2H9v-2h2v-2h1v-3h1z"/>
      <path fill="#243247" d="M13 22h3v4h-1v3h-2v-3h-1z"/>
      <path fill="#394655" d="M12 25h3v1h-3z"/>
      <path fill="#090f18" d="M10 29h4v1h2v2H8v-1h2z"/>
      <path fill="#101a28" d="M18 20h4v5h1v4h2v2h-7v-2h1v-4h-1z"/>
      <path fill="#243247" d="M19 22h2v4h1v3h-2v-3h-1z"/>
      <path fill="#394655" d="M19 25h3v1h-3z"/>
      <path fill="#090f18" d="M18 29h4v1h2v2h-7v-1h1z"/>
    </g>

    <!-- Resting arms and gloves -->
    <g id="idleArms">
      <path fill="#101a28" d="M10 11h4v3h-2v4H9v-2H8v-2h2z"/>
      <path fill="#243247" d="M11 12h2v2h-1v4h-2v-2H9v-1h2z"/>
      <path fill="#111923" d="M8 16h3v3H9v-1H8z"/>
      <path fill="#101a28" d="M21 11h3v2h2v4h-2v3h-2v-4h-2z"/>
      <path fill="#243247" d="M21 12h2v2h2v3h-1v2h-1v-4h-2z"/>
      <path fill="#111923" d="M22 18h3v3h-2v-1h-1z"/>
    </g>

    <!-- Rifle held diagonally at rest -->
    <g id="rifleRest">
      <path fill="#080d14" d="M12 13h3v2h3v2h2v2h2v2h2v2h-3v-2h-2v-2h-2v-2h-2v-2h-3z"/>
      <path fill="#303b49" d="M13 14h2v2h3v2h2v2h2v2h-2v-2h-2v-2h-2v-2h-3z"/>
      <path fill="#111923" d="M11 12h4v3h-2v2h-2z M20 19h3v2h-3z"/>
      <path fill="#586574" d="M14 14h2v1h-2z M20 20h2v1h-2z"/>
      <path fill="#080d14" d="M17 16h3v2h-3z M18 22h2v4h-2z"/>
    </g>

    <!-- Aimed rifle, pointing right -->
    <g id="rifleAim">
      <path fill="#080d14" d="M10 13h5v-1h8v1h3v-1h4v2h2v2h-8v-1h-5v2h-5v-1h-4z"/>
      <path fill="#303b49" d="M12 13h3v1h7v1h-5v2h-3v-2h-2z"/>
      <path fill="#586574" d="M17 12h5v1h-5z M27 13h3v1h-3z"/>
      <path fill="#111923" d="M14 16h3v4h-2v-2h-2z M20 16h2v3h-2z"/>
      <path fill="#080d14" d="M18 10h4v2h-4z M24 11h2v2h-2z"/>
      <path fill="#46505a" d="M19 10h2v1h-2z"/>
    </g>

    <!-- Arms braced around the aimed rifle -->
    <g id="aimArms">
      <path fill="#101a28" d="M10 11h4v3h3v2h-3v2h-3v-2H9v-2h1z"/>
      <path fill="#243247" d="M11 12h2v2h3v1h-3v2h-2v-2H9v-1h2z"/>
      <path fill="#111923" d="M14 14h3v2h-3z"/>
      <path fill="#101a28" d="M19 13h4v2h3v2h-3v2h-3v-2h-2v-2h2z"/>
      <path fill="#243247" d="M20 14h3v1h3v1h-3v2h-2v-2h-2v-1h1z"/>
      <path fill="#111923" d="M23 15h3v2h-3z"/>
    </g>

    <g id="soldier">
      <use href="#legs"/>
      <use href="#rifleRest"/>
      <use href="#core"/>
      <use href="#idleArms"/>
    </g>
  </defs>

  <!-- IDLE -->
  <g transform="translate(0 0)"><use href="#soldier"/></g>
  <g transform="translate(32 0)">
    <g transform="translate(0 -1)"><use href="#soldier"/></g>
  </g>
  <g transform="translate(64 0)"><use href="#soldier"/></g>
  <g transform="translate(96 0)">
    <g transform="translate(0 1)"><use href="#soldier"/></g>
  </g>

  <!-- ATTACK: raise rifle, aim, fire, recover -->
  <g transform="translate(0 32)">
    <use href="#legs"/>
    <use href="#core"/>
    <use href="#rifleAim"/>
    <use href="#aimArms"/>
  </g>

  <g transform="translate(32 32)">
    <g transform="translate(1 0)">
      <use href="#legs"/>
      <use href="#core"/>
      <use href="#rifleAim"/>
      <use href="#aimArms"/>
    </g>
    <path fill="#8effa4" d="M30 13h2v3h-2z"/>
    <path fill="#e7ffd0" d="M31 14h1v1h-1z"/>
  </g>

  <g transform="translate(64 32)">
    <g transform="translate(-1 0)">
      <use href="#legs"/>
      <use href="#core"/>
      <use href="#rifleAim"/>
      <use href="#aimArms"/>
    </g>
    <!-- Muzzle flash -->
    <path fill="#ffd84a" d="M30 12h2v2h2v3h-2v2h-2v-2h-2v-3h2z"/>
    <path fill="#fff4b0" d="M31 14h2v2h-2z"/>
  </g>

  <g transform="translate(96 32)">
    <use href="#legs"/>
    <use href="#core"/>
    <use href="#rifleAim"/>
    <use href="#aimArms"/>
    <path fill="#ffd84a" d="M30 13h2v3h-2z"/>
    <path fill="#fff4b0" d="M31 14h1v1h-1z"/>
  </g>

  <!-- DAMAGE -->
  <g transform="translate(0 64)"><use href="#soldier"/></g>
  <g transform="translate(32 64)">
    <g transform="translate(-1 0)"><use href="#soldier"/></g>
    <path fill="#b75b5b" d="M15 6h6v2h-2v3h-3V9h-2z"/>
  </g>
  <g transform="translate(64 64)">
    <g transform="translate(-1 0)"><use href="#soldier"/></g>
    <path fill="#8effa4" d="M26 8h2v1h-2z"/>
  </g>
  <g transform="translate(96 64)"><use href="#soldier"/></g>

  <!-- DEATH -->
  <g transform="translate(0 96)"><use href="#soldier"/></g>
  <g transform="translate(32 96)">
    <g transform="translate(0 3) scale(1 .88)"><use href="#soldier"/></g>
  </g>
  <g transform="translate(64 96)">
    <g transform="rotate(20 16 24)"><use href="#soldier"/></g>
  </g>
  <g transform="translate(96 96)">
    <!-- Fallen soldier and rifle -->
    <path fill="#101a28" d="M5 23h8v-2h6v2h4v3h-3v2H9v-1H6v-2H4z"/>
    <path fill="#243247" d="M8 23h7v2H8z M14 22h5v2h-5z"/>
    <path fill="#090f18" d="M5 27h5v1h2v2H4v-1h1z"/>
    <path fill="#0c1420" d="M14 20h7v2h3v4h-3v2h-5v-2h-3v-4h1z"/>
    <path fill="#27364a" d="M15 21h6v3h2v2h-7v-2h-2v-2h1z"/>
    <path fill="#111923" d="M21 24h9v2h-9z M27 23h3v1h-3z"/>
    <path fill="#45515d" d="M26 24h3v1h-3z"/>
    <path fill="#0c1420" d="M22 22h3v2h-3z"/>
    <path fill="#37a867" d="M19 8h1v1h-1z"/>
  </g>
</svg>
