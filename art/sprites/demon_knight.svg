<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"
     viewBox="0 0 128 128" shape-rendering="crispEdges">
  <defs>
    <g id="body">
      <!-- Legs and boots -->
      <path fill="#142335" d="M11 20h5v4h-1v4h-2v2H8v-2h2v-2h1v-3h1z
                              M17 20h5v4h1v4h2v2h-7v-2h-1v-4h1z"/>
      <path fill="#647b8d" d="M12 22h3v4h-1v3h-3v-1h2z
                              M18 22h3v4h1v3h-3v-3h-1z"/>
      <path fill="#26394f" d="M9 29h5v1H8v-1z M18 29h5v1h-5z"/>

      <!-- Torso and armor -->
      <path fill="#142335" d="M10 10h3v2h8v-2h3v4h-2v6h-2v2h-8v-2h-2v-6h-1z"/>
      <path fill="#315f83" d="M13 13h7v8h-7z"/>
      <path fill="#9bb4c2" d="M11 12h2v7h-1v2h-1z M20 12h2v7h-2z"/>
      <path fill="#26394f" d="M12 18h9v2h-9z"/>
      <path fill="#c2d7df" d="M15 18h3v1h-3z"/>

      <!-- Arm -->
      <path fill="#26394f" d="M9 13h3v4h2v2h-3v-2H9z"/>
      <path fill="#829aaa" d="M10 14h1v3h1v1h-1v-1h-1z"/>

      <!-- Helmet and water plume -->
      <path fill="#142335" d="M13 4h7v1h2v5h-2v2h-8v-2h-2V6h3z"/>
      <path fill="#647b8d" d="M14 5h5v1h2v4h-2v1h-6V9h-1V7h2z"/>
      <path fill="#b4cbd6" d="M14 5h3v1h-2v3h-1z M18 6h1v3h-1z"/>
      <path fill="#101c2b" d="M13 8h2v2h-2z M18 8h2v2h-2z"/>
      <path fill="#78dff5" d="M16 3h3V2h2v2h-2v1h-3z"/>

      <!-- Shield -->
      <path fill="#142335" d="M22 11h6v2h2v10h-2v3h-2v2h-2v-2h-2v-3h-1V13h1z"/>
      <path fill="#315b7c" d="M23 13h5v2h1v8h-2v3h-2v-2h-2v-3h-1v-7h1z"/>
      <path fill="#9db5c3" d="M23 13h1v10h1v3h-1v-2h-1v-3h-1v-7h1z"/>
      <path fill="#d1e4ea" d="M24 14h1v2h2v1h-2v2h-1v-2h-1v-1h1z"/>
    </g>

    <!-- Resting sword -->
    <g id="sword">
      <path fill="#142335" d="M2 5h3v2h2v3h2v3h2v3h2v2h-2v3h-2v-2H7v-3H5v-3H4v-3H3V9H2z"/>
      <path fill="#83eaff" d="M3 6h2v2h2v3h2v3h2v3h2v1h-2v2h-1v-2H8v-3H6v-3H5v-3H4V8H3z"/>
      <path fill="#d2fbff" d="M4 7h1v2h2v3h2v3h2v1h-1v-1H8v-3H6v-3H5V9H4z"/>
      <path fill="#344c63" d="M8 17h7v2H8z"/>
    </g>
  </defs>

  <!-- IDLE: gentle bob -->
  <g transform="translate(0 0)">
    <use href="#body"/>
    <use href="#sword"/>
  </g>
  <g transform="translate(32 0)">
    <g transform="translate(0 -1)"><use href="#body"/><use href="#sword"/></g>
  </g>
  <g transform="translate(64 0)">
    <use href="#body"/>
    <use href="#sword"/>
  </g>
  <g transform="translate(96 0)">
    <g transform="translate(0 1)"><use href="#body"/><use href="#sword"/></g>
  </g>

  <!-- ATTACK: wind up, swing, follow through, projectile -->
  <g transform="translate(0 32)">
    <use href="#body"/>
    <use href="#sword"/>
  </g>
  <g transform="translate(32 32)">
    <use href="#body"/>
    <g transform="rotate(35 11 18)"><use href="#sword"/></g>
    <path fill="#83eaff" d="M8 14h3v-2h3v-2h2v2h-2v2h-3v2H8z"/>
  </g>
  <g transform="translate(64 32)">
    <g transform="translate(1 1)">
      <use href="#body"/>
      <g transform="rotate(90 11 18)"><use href="#sword"/></g>
    </g>
    <path fill="#83eaff" opacity=".85"
          d="M7 20l2-2 3-2 2-3 4-3 3-3 2 2-3 3-3 3-3 2-3 3-2 2z"/>
    <path fill="#d2fbff"
          d="M9 18l3-2 2-3 4-3 2-2 1 1-3 3-3 3-3 2-2 2z"/>
  </g>
  <g transform="translate(96 32)">
    <use href="#body"/>
    <use href="#sword"/>
    <path fill="#83eaff" d="M25 6h3v1h2v2h-1v3h-2v1h-3v-1h-2V9h1V7h2z"/>
    <path fill="#d2fbff" d="M26 7h2v2h-1v2h-2V9h1z"/>
    <path fill="#b6f5ff" d="M22 9h2v1h-2z M29 7h1v2h-1z"/>
  </g>

  <!-- DAMAGE: hit, step back, recover -->
  <g transform="translate(0 64)">
    <use href="#body"/>
    <use href="#sword"/>
  </g>
  <g transform="translate(32 64)">
    <g transform="translate(-1 0)">
      <use href="#body"/>
      <use href="#sword"/>
    </g>
    <path fill="#ff7181" d="M13 7h6v2h-2v3h-3V9h-2z"/>
    <path fill="#ffd5dd" d="M24 9h2v2h-2z M26 7h1v2h-1z"/>
  </g>
  <g transform="translate(64 64)">
    <g transform="translate(-1 0)">
      <use href="#body"/>
      <use href="#sword"/>
    </g>
    <path fill="#b6f5ff" d="M26 12h3v1h-3z M27 16h2v1h-2z"/>
  </g>
  <g transform="translate(96 64)">
    <use href="#body"/>
    <use href="#sword"/>
  </g>

  <!-- DEATH: stagger, fall, dissolve -->
  <g transform="translate(0 96)">
    <use href="#body"/>
    <use href="#sword"/>
  </g>
  <g transform="translate(32 96)">
    <g transform="rotate(10 16 22)">
      <use href="#body"/>
      <use href="#sword"/>
    </g>
  </g>
  <g transform="translate(64 96)">
    <g transform="rotate(24 16 22)">
      <use href="#body"/>
      <use href="#sword"/>
    </g>
    <path fill="#83eaff" d="M7 20h1v2H7z M26 17h1v2h-1z"/>
  </g>
  <g transform="translate(96 96)">
    <path fill="#315f83" d="M5 27h4v-1h14v1h4v2h-3v1H8v-1H5z"/>
    <path fill="#83eaff" d="M9 27h12v1H9z M23 25h1v2h-1z"/>
    <path fill="#142335" d="M14 21h5v1h2v3h-2v1h-5v-1h-2v-3h2z"/>
    <path fill="#647b8d" d="M15 22h4v2h-1v1h-3z"/>
    <path fill="#83eaff" d="M4 22h2v1h2v1H6v1H4z"/>
    <path fill="#142335" d="M3 21h2v1H3z M7 23h2v1H7z"/>
  </g>
</svg>
