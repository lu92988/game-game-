<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"
     viewBox="0 0 128 128" shape-rendering="crispEdges">
  <defs>
    <!-- Head, hair, suit, waistcoat and cravat -->
    <g id="core">
      <path fill="#151319" d="M10 11h4V9h9v2h3v10h-2v2H12v-2h-2z"/>
      <path fill="#30232a" d="M12 12h2v7h-1v2h-1z M23 12h2v7h-2z"/>
      <path fill="#574532" d="M14 11h2v2h2v5h-2v2h-3v-2h1z"/>
      <path fill="#18151b" d="M15 12h2v2h2v-2h2v7h-2v3h-5v-3h2v-4h-1z"/>
      <path fill="#9a7848" d="M14 12h2v2h-2z M20 12h2v2h-2z M15 19h1v2h-1z M20 19h1v2h-1z"/>
      <path fill="#681e31" d="M17 12h3v2h-1v2h1v2h-3v-2h1v-2h-1z"/>
      <path fill="#d0af6b" d="M17 12h1v2h1v1h-2z M18 17h1v1h-1z"/>

      <!-- Face -->
      <path fill="#a96f55" d="M15 5h6v1h2v4h-2v2h-6v-2h-2V7h2z"/>
      <path fill="#d5a184" d="M16 6h5v1h1v3h-2v1h-4v-2h-1V7h1z"/>
      <path fill="#30202a" d="M19 8h2v1h-2z M22 9h1v1h-1z"/>

      <!-- Wavy blond hair -->
      <path fill="#493528" d="M13 7V5h2V3h3V2h4v2h3v3h-2V6h-2V5h-3v2h-2v2h-2V7z"/>
      <path fill="#a88a68" d="M14 6V4h2V3h3v2h3v2h-2V6h-3v2h-2v1h-2V6z"/>
      <path fill="#d1b18a" d="M16 4h2V3h2v2h-2v1h-2z M22 5h2v2h-2z"/>
    </g>

    <!-- Legs and polished shoes -->
    <g id="legs">
      <path fill="#17151a" d="M12 21h5v4h-1v4h-2v2H9v-2h2v-2h1v-3h1z"/>
      <path fill="#30232a" d="M13 23h3v4h-1v3h-2v-3h-1z"/>
      <path fill="#08090d" d="M10 29h4v1h2v2H8v-1h2z"/>
      <path fill="#b08a50" d="M10 30h4v1h-4z"/>

      <path fill="#17151a" d="M18 21h4v4h1v4h2v2h-7v-2h1v-4h-1z"/>
      <path fill="#30232a" d="M19 23h2v4h1v3h-2v-3h-1z"/>
      <path fill="#08090d" d="M18 29h4v1h2v2h-7v-1h1z"/>
      <path fill="#b08a50" d="M18 30h4v1h-4z"/>
    </g>

    <!-- Arms and gold cuff details -->
    <g id="arms">
      <path fill="#17151a" d="M10 11h4v3h-2v3H9v-2H8v-2h2z"/>
      <path fill="#30232a" d="M11 12h2v2h-1v3h-2v-2H9v-1h2z"/>
      <path fill="#d5a184" d="M8 16h2v2H8z"/>
      <path fill="#b08a50" d="M9 14h2v1H9z"/>

      <path fill="#17151a" d="M21 11h3v2h2v4h-2v3h-2v-4h-2z"/>
      <path fill="#30232a" d="M21 12h2v2h2v3h-1v2h-1v-4h-2z"/>
      <path fill="#d5a184" d="M22 18h2v3h-1v1h-2v-2h1z"/>
      <path fill="#b08a50" d="M22 16h2v1h-2z"/>
    </g>

    <!-- Cane, held at the right side -->
    <g id="cane">
      <path fill="#17151a" d="M24 13h2v15h-2z"/>
      <path fill="#b08a50" d="M23 11h4v2h-1v2h-2v-2h-1z"/>
      <path fill="#e0c27c" d="M24 12h2v1h-2z"/>
      <path fill="#574532" d="M24 20h2v1h-2z"/>
    </g>

    <g id="noble">
      <use href="#legs"/>
      <use href="#cane"/>
      <use href="#core"/>
      <use href="#arms"/>
    </g>
  </defs>

  <!-- IDLE -->
  <g transform="translate(0 0)"><use href="#noble"/></g>
  <g transform="translate(32 0)">
    <g transform="translate(0 -1)"><use href="#noble"/></g>
  </g>
  <g transform="translate(64 0)"><use href="#noble"/></g>
  <g transform="translate(96 0)">
    <g transform="translate(0 1)"><use href="#noble"/></g>
  </g>

  <!-- ATTACK: draw cane back, swing, lunge, impact -->
  <g transform="translate(0 32)">
    <use href="#noble"/>
  </g>

  <g transform="translate(32 32)">
    <use href="#legs"/>
    <use href="#core" transform="rotate(4 16 20)"/>
    <use href="#arms"/>
    <use href="#cane" transform="rotate(-25 24 19)"/>
    <path fill="#d0af6b" d="M26 12h2v2h-2z"/>
  </g>

  <g transform="translate(64 32)">
    <g transform="translate(1 0)">
      <use href="#legs"/>
      <use href="#core" transform="rotate(9 16 20)"/>
      <use href="#arms"/>
      <use href="#cane" transform="rotate(-55 24 19)"/>
    </g>
    <path fill="#d0af6b" d="M8 12h4v1H8z M6 15h4v1H6z"/>
  </g>

  <g transform="translate(96 32)">
    <g transform="translate(1 0)">
      <use href="#legs"/>
      <use href="#core" transform="rotate(7 16 20)"/>
      <use href="#arms"/>
      <use href="#cane" transform="rotate(-70 24 19)"/>
    </g>
    <!-- Gold strike flash -->
    <path fill="#d0af6b" d="M27 10h2v2h2v2h-2v2h-2v2h-2v-3h-2v-2h2v-2h2z"/>
    <path fill="#fff0b2" d="M28 12h2v2h1v1h-2v2h-1v-2h-2v-2h2z"/>
  </g>

  <!-- DAMAGE -->
  <g transform="translate(0 64)"><use href="#noble"/></g>
  <g transform="translate(32 64)">
    <g transform="translate(-1 0)"><use href="#noble"/></g>
    <path fill="#c66a62" d="M16 6h5v2h-2v3h-3V9h-2z"/>
  </g>
  <g transform="translate(64 64)">
    <g transform="translate(-1 0)"><use href="#noble"/></g>
    <path fill="#d0af6b" d="M27 12h2v1h-2z M28 16h2v1h-2z"/>
  </g>
  <g transform="translate(96 64)"><use href="#noble"/></g>

  <!-- DEATH: stagger, sink down, fall -->
  <g transform="translate(0 96)"><use href="#noble"/></g>
  <g transform="translate(32 96)">
    <g transform="translate(0 3) scale(1 .88)"><use href="#noble"/></g>
  </g>
  <g transform="translate(64 96)">
    <g transform="rotate(22 16 24)"><use href="#noble"/></g>
  </g>
  <g transform="translate(96 96)">
    <!-- Fallen noble, cane beside him -->
    <path fill="#17151a" d="M5 23h8v-2h6v2h4v3h-3v2H9v-1H6v-2H4z"/>
    <path fill="#30232a" d="M8 23h7v2H8z M14 22h5v2h-5z"/>
    <path fill="#08090d" d="M5 27h5v1h2v2H4v-1h1z"/>
    <path fill="#17151a" d="M15 20h7v2h3v4h-3v2h-5v-2h-3v-4h1z"/>
    <path fill="#30232a" d="M16 21h6v3h2v2h-7v-2h-2v-2h1z"/>
    <path fill="#681e31" d="M18 22h3v2h-1v2h-3v-2h1z"/>
    <path fill="#a96f55" d="M23 20h4v1h2v3h-2v2h-4v-2h-1v-3h1z"/>
    <path fill="#d5a184" d="M24 21h4v2h-1v2h-3v-2h-1v-1h1z"/>
    <path fill="#493528" d="M22 21v-2h2v-1h3v2h2v2h-2v-1h-3v2h-2z"/>
    <path fill="#a88a68" d="M23 20v-1h3v1h2v1h-3v1h-2z"/>
    <path fill="#17151a" d="M29 21h1v8h-1z"/>
    <path fill="#b08a50" d="M28 20h3v1h-1v2h-2v-1h-1v-1h1z"/>
  </g>
</svg>
