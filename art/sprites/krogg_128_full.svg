<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="896"
     viewBox="0 0 1024 896" shape-rendering="crispEdges">
  <!-- Krogg, 128x128 frames, 8 per row. Rows: idle, attack, hurt, death,
       victory, defend, item. Body parts are the user's original 4x4
       sheet (krogg_128.svg); the extra frames and rows reuse them. -->
