<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"
     viewBox="0 0 128 128" shape-rendering="crispEdges">
  <defs>
    <!-- Slim helmet, narrow torso and glowing core -->
    <g id="core">
      <path fill="#191a1d" d="M12 11h2V9h7v2h2v9h-2v2h-7v-2h-2z"/>
      <path fill="#514d48" d="M13 12h2v2h-1v5h-1z M21 12h1v7h-1z"/>
      <path fill="#363638" d="M15 12h5v2h1v4h-1v2h-5v-2h-1v-4h1z"/>
      <path fill="#ff6414" d="M16 14h3v1h2v3h-2v1h-3v-1h-1v-3h1z"/>
      <path fill="#ffd84a" d="M17 15h2v2h-1v1h-1z"/>
      <path fill="#ff6414" d="M13 16h1v3h1v2h-1v-1h-1z M21 18h1v2h-1z"/>

      <!-- Helmet and visor -->
      <path fill="#191a1d" d="M14 4h6v1h2v5h-2v2h-7v-2h-2V6h3z"/>
      <path fill="#514d48" d="M15 5h4v1h2v3h-2v1h-5V8h-1V6h2z"/>
      <path fill="#ff6414" d="M14 8h7v1h-2v1h-4V9h-1z"/>
      <path fill="#ffd84a" d="M15 8h4v1h-4z"/>

      <!-- Small flame crest -->
      <path fill="#bf3510" d="M16 4V2h2V0h2v3h2V1h1v4h-2V4h-2v2h-2V4z"/>
      <path fill="#ff6414" d="M17 4V2h1v2h2V2h1v3h-2v1h-2z"/>
      <path fill="#ffd84a" d="M18 3h1v2h-1z"/>
    </g>

    <!-- Slim legs -->
    <g id="legs">
      <path fill="#191a1d" d="M12 20h4v5h-1v4h-2v2H9v-2h2v-2h1v-3h1z"/>
      <path fill="#514d48" d="M13 22h2v4h-1v3h-1v-3h-1z"/>
      <path fill="#ff6414" d="M13 25h1v3h-1z"/>
      <path fill="#77716a" d="M10 29h4v1h2v2H8v-1h2z"/>
      <path fill="#191a1d" d="M17 20h4v5h1v4h2v2h-6v-2h1v-4h-1z"/>
      <path fill="#514d48" d="M18 22h2v4h1v3h-1v-3h-1z"/>
      <path fill="#ff6414" d="M19 25h1v3h-1z"/>
      <path fill="#77716a" d="M18 29h4v1h2v2h-7v-1h1z"/>
    </g>

    <!-- Clearly separated shoulder, forearm and hand pieces -->
    <g id="arms">
      <path fill="#191a1d" d="M11 11h3v3h-2v3H9v-2H8v-2h3z"/>
      <path fill="#514d48" d="M11 12h2v2h-1v3h-2v-2H9v-1h2z"/>
      <path fill="#ff6414" d="M10 15h1v2h-1z"/>
      <path fill="#77716a" d="M8 16h2v2H8z"/>

      <path fill="#191a1d" d="M20 11h3v2h2v4h-2v3h-2v-4h-2z"/>
      <path fill="#514d48" d="M20 12h2v2h2v3h-1v2h-1v-4h-2z"/>
      <path fill="#ff6414" d="M22 17h1v2h-1z"/>
      <path fill="#77716a" d="M22 19h2v2h-2z"/>
    </g>

    <!-- Wide, bent legs for the dash -->
    <g id="crouchLegs">
      <path fill="#191a1d" d="M12 19h4v4l-2 2-3 2H7v-2h3l2-2 1-2z"/>
      <path fill="#514d48" d="M12 21h3v2l-2 2h-2l2-2z"/>
      <path fill="#77716a" d="M8 25h4v1h2v2H6v-1h2z"/>
      <path fill="#191a1d" d="M17 19h4v4l3 3-1 3h-5v-2h3l-2-3-2-2z"/>
      <path fill="#514d48" d="M18 21h2l2 3-1 2h-2v-2l-1-1z"/>
      <path fill="#77716a" d="M19 27h4v1h2v2h-7v-1h1z"/>
    </g>

    <g id="dashLegs">
      <!-- Back leg pushes behind; front knee tucks forward -->
      <path fill="#191a1d" d="M12 17h4v4h-3l-3 3-4 1-3-2 2-2 3 1 3-3z"/>
      <path fill="#514d48" d="M10 21h5l-3 3-4 1-1-1 3-1z"/>
      <path fill="#77716a" d="M4 22h4v2l3 1-1 2-5-2-2-2z"/>
      <path fill="#191a1d" d="M17 17h4v4l3 2-2 3h-4l1-3-3-2z"/>
      <path fill="#514d48" d="M18 19h3v2l2 2h-3l-2-2z"/>
      <path fill="#77716a" d="M19 24h4v2h-5z"/>
    </g>

    <!-- Arm drawn back for balance -->
    <g id="backArm">
      <path fill="#191a1d" d="M11 11h3v3l-3 2H8v-2h2z"/>
      <path fill="#514d48" d="M11 12h2v2l-3 2H9v-1h2z"/>
      <path fill="#ff6414" d="M8 14h2v2H8z"/>
    </g>

    <!-- Arm fully extended into the punch -->
    <g id="punchArm">
      <path fill="#191a1d" d="M20 11h3v2h3v2h4v3h-4v-1h-4v-2h-3z"/>
      <path fill="#514d48" d="M21 12h2v2h3v2h3v1h-4v-1h-4v-2h-1z"/>
      <path fill="#ff6414" d="M24 14h3v1h3v2h-4v-1h-2z"/>
      <path fill="#77716a" d="M27 15h3v2h-3z"/>
      <path fill="#ffd84a" d="M28 16h2v1h-2z"/>
    </g>

    <g id="robot">
      <use href="#legs"/>
      <use href="#arms"/>
      <use href="#core"/>
    </g>
  </defs>

  <!-- IDLE -->
  <g transform="translate(0 0)"><use href="#robot"/></g>
  <g transform="translate(32 0)">
    <g transform="translate(0 -1)"><use href="#robot"/></g>
    <path fill="#ff6414" d="M7 13h1v2H7z"/>
  </g>
  <g transform="translate(64 0)"><use href="#robot"/></g>
  <g transform="translate(96 0)">
    <g transform="translate(0 1)"><use href="#robot"/></g>
    <path fill="#ffd84a" d="M25 8h1v2h-1z"/>
  </g>

  <!-- ATTACK: crouch, push off, dash forward, heat punch -->
  <g transform="translate(0 32)">
    <use href="#crouchLegs"/>
    <use href="#backArm"/>
    <use href="#core" transform="translate(-1 1)"/>
    <path fill="#ff6414" d="M22 14h2v2h-2z"/>
  </g>

  <g transform="translate(32 32)">
    <g transform="translate(1 0)">
      <use href="#dashLegs"/>
      <use href="#backArm"/>
      <use href="#core" transform="rotate(8 16 20)"/>
      <use href="#punchArm"/>
    </g>
    <path fill="#ff6414" d="M2 14h4v1H2z M4 17h3v1H4z"/>
    <path fill="#ffd84a" d="M3 15h2v1H3z"/>
  </g>

  <g transform="translate(64 32)">
    <g transform="translate(2 0)">
      <use href="#dashLegs"/>
      <use href="#backArm"/>
      <use href="#core" transform="rotate(12 16 20)"/>
      <use href="#punchArm"/>
    </g>
    <path fill="#ff6414" d="M2 12h5v1H2z M4 15h5v1H4z M6 18h4v1H6z"/>
    <path fill="#ffd84a" d="M3 13h3v1H3z M6 16h2v1H6z"/>
  </g>

  <g transform="translate(96 32)">
    <g transform="translate(2 0)">
      <use href="#dashLegs"/>
      <use href="#backArm"/>
      <use href="#core" transform="rotate(10 16 20)"/>
      <use href="#punchArm"/>
    </g>
    <!-- Impact flash around the punching fist -->
    <path fill="#ff6414" d="M28 11h2v2h2v2h-2v2h-2v2h-2v-3h-2v-2h2v-2h2z"/>
    <path fill="#ffd84a" d="M28 13h2v2h1v1h-2v2h-1v-2h-2v-2h2z"/>
    <path fill="#fff3a1" d="M29 14h1v2h-1z"/>
  </g>

  <!-- DAMAGE -->
  <g transform="translate(0 64)"><use href="#robot"/></g>
  <g transform="translate(32 64)">
    <g transform="translate(-1 0)"><use href="#robot"/></g>
    <path fill="#ffb02e" d="M15 6h6v2h-2v3h-3V9h-2z"/>
    <path fill="#fff3a1" d="M26 8h2v1h-2z"/>
  </g>
  <g transform="translate(64 64)">
    <g transform="translate(-1 0)"><use href="#robot"/></g>
    <path fill="#ff6414" d="M27 13h2v1h-2z M26 17h2v1h-2z"/>
  </g>
  <g transform="translate(96 64)"><use href="#robot"/></g>

  <!-- DEATH: buckle, fall, lie still -->
  <g transform="translate(0 96)">
    <use href="#crouchLegs"/>
    <use href="#backArm"/>
    <use href="#core" transform="translate(0 1)"/>
  </g>
  <g transform="translate(32 96)">
    <g transform="rotate(14 16 23)">
      <use href="#crouchLegs"/>
      <use href="#backArm"/>
      <use href="#core" transform="translate(0 2)"/>
    </g>
  </g>
  <g transform="translate(64 96)">
    <g transform="rotate(30 16 24)">
      <use href="#dashLegs"/>
      <use href="#backArm"/>
      <use href="#core" transform="translate(0 2)"/>
    </g>
  </g>
  <g transform="translate(96 96)">
    <!-- Fallen robot -->
    <path fill="#191a1d" d="M4 23h8v-2h6v2h4v3h-3v2H9v-1H6v-2H4z"/>
    <path fill="#514d48" d="M7 23h7v2H7z M14 22h5v2h-5z"/>
    <path fill="#77716a" d="M5 27h5v1h2v2H4v-1h1z"/>
    <path fill="#191a1d" d="M14 20h7v2h3v4h-3v2h-5v-2h-3v-4h1z"/>
    <path fill="#514d48" d="M15 21h6v3h2v2h-7v-2h-2v-2h1z"/>
    <path fill="#8c2707" d="M17 22h3v1h1v2h-2v1h-3v-1h-1v-2h2z"/>
    <path fill="#ff6414" d="M18 23h2v2h-2z"/>
    <path fill="#191a1d" d="M23 21h5v1h2v3h-2v2h-5v-2h-1v-3h1z"/>
    <path fill="#514d48" d="M24 22h4v2h-1v2h-3z"/>
    <path fill="#bf3510" d="M16 19h1v2h-1z M28 18h1v2h-1z"/>
  </g>
</svg>
