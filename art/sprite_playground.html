<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprite Playground</title>
<style>
  :root { --bg:#14121a; --panel:#1d1a24; --ink:#ede6d6; --muted:#8f8798; --gold:#c9a227; --line:#332c3d; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 16px 40px; background:var(--bg); color:var(--ink); font-family:Georgia,serif; text-align:center; }
  h1 { color:var(--gold); font-weight:600; font-size:24px; margin:0 0 4px; }
  h2 { color:var(--gold); font-weight:600; font-size:17px; letter-spacing:2px; text-transform:uppercase; margin:28px 0 12px; }
  p.sub { color:var(--muted); margin:0 0 8px; font-size:14px; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; max-width:1100px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .card h3 { margin:0 0 8px; font-size:15px; font-weight:600; }
  .poses { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .poses canvas { width:100%; aspect-ratio:1; image-rendering:pixelated; background:#3a3444; border-radius:4px; display:block; }
  .poses span { display:block; font-size:11px; color:var(--muted); margin-top:3px; }
  .pick { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:0 0 12px; }
  .pick button, .pad button { font:inherit; font-size:14px; padding:10px 14px; border-radius:6px; border:1px solid var(--gold); background:var(--panel); color:var(--ink); cursor:pointer; touch-action:none; user-select:none; }
  .pick button.on { background:var(--gold); color:#14121a; }
  #game { width:100%; max-width:960px; aspect-ratio:16/9; image-rendering:pixelated; border:1px solid var(--line); border-radius:8px; display:block; margin:0 auto; background:#000; }
  .pad { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; }
  .keys { color:var(--muted); font-size:13px; margin-top:10px; }
</style>
</head>
<body>
<h1>Champion Sprite Playground</h1>
<p class="sub">Your animated sprites so far, 32&times;32 pixels each.</p>

<h2>Animations</h2>
<div class="gallery" id="gallery"></div>

<h2>Try them out</h2>
<div class="pick" id="pick"></div>
<canvas id="game" width="320" height="180"></canvas>
<div class="keys">Keyboard: &larr; &rarr; move &middot; &uarr; or Space jump &middot; X attack &middot; Z get hit &middot; C fall / get back up</div>
<div class="pad">
  <button data-k="left">&#9664;</button><button data-k="right">&#9654;</button>
  <button data-k="jump">Jump</button><button data-k="attack">Attack</button>
  <button data-k="hurt">Hit</button><button data-k="death">Fall</button>
</div>

];
const POSES = ['Idle', 'Attack', 'Hit', 'Death'];
const F = 32;

let loaded = 0;
CHARS.forEach(c => {
  c.img = new Image();
  c.img.onload = () => { if (++loaded === CHARS.length) start(); };
  c.img.src = c.src;
});

// Draws one frame. faceRight = which way the champion should look.
function frame(ctx, c, row, col, x, y, faceRight, scale = 1) {
  const flip = faceRight === c.facesLeft;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (flip) {
    ctx.translate(Math.round(x) + F * scale, Math.round(y));
    ctx.scale(-1, 1);
    ctx.drawImage(c.img, col * F, row * F, F, F, 0, 0, F * scale, F * scale);
  } else {
    ctx.drawImage(c.img, col * F, row * F, F, F, Math.round(x), Math.round(y), F * scale, F * scale);
  }
  ctx.restore();
}

function start() {
  // Gallery: every pose of every champion, looping.
  const gal = document.getElementById('gallery');
  const cells = [];
  CHARS.forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<h3>' + c.name + '</h3>';
    const poses = document.createElement('div');
    poses.className = 'poses';
    POSES.forEach((p, row) => {
      const wrap = document.createElement('div');
      const cv = document.createElement('canvas');
      cv.width = F; cv.height = F;
      wrap.append(cv);
      const label = document.createElement('span');
      label.textContent = p;
      wrap.append(label);
      poses.append(wrap);
      cells.push({ c, row, ctx: cv.getContext('2d') });
    });
    card.append(poses);
    gal.append(card);
  });
  let galTick = 0;
  setInterval(() => {
    galTick++;
    cells.forEach(({ c, row, ctx }) => {
      ctx.clearRect(0, 0, F, F);
      // Death holds its last frame for a beat before looping.
      const col = row === 3 ? Math.min(3, galTick % 7) : galTick % 4;
      frame(ctx, c, row, col, 0, 0, true);
    });
  }, 180);

  // Picker
  const pick = document.getElementById('pick');
  CHARS.forEach((c, i) => {
    const b = document.createElement('button');
    b.textContent = c.name;
    b.onclick = () => { hero.c = c; hero.dead = false; hero.anim = null; [...pick.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); };
    if (i === 0) b.classList.add('on');
    pick.append(b);
  });

  hero.c = CHARS[0];
  loop();
}

// --- tiny level -------------------------------------------------------
const W = 320, H = 180, GROUND = 150;
const ctx = document.getElementById('game').getContext('2d');
const platforms = [{ x: 80, y: 118, w: 48 }, { x: 170, y: 94, w: 44 }, { x: 240, y: 122, w: 50 }];
const hero = { c: null, x: 30, y: GROUND - F, vx: 0, vy: 0, face: 1, onGround: true, anim: null, dead: false, t: 0 };
const keys = {};
const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'jump', ' ': 'jump', x: 'attack', X: 'attack', z: 'hurt', Z: 'hurt', c: 'death', C: 'death' };
addEventListener('keydown', e => { const k = map[e.key]; if (!k) return; e.preventDefault(); if (!keys[k]) press(k); keys[k] = true; });
addEventListener('keyup', e => { const k = map[e.key]; if (k) keys[k] = false; });
document.querySelectorAll('.pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); if (!keys[k]) press(k); keys[k] = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, () => keys[k] = false));
});

// One-shot animations: attack (row 1), hit (row 2), death (row 3).
function press(k) {
  if (k === 'death') { hero.dead = !hero.dead; hero.anim = hero.dead ? { row: 3, f: 0 } : null; return; }
  if (hero.dead) return;
  if (k === 'attack') hero.anim = { row: 1, f: 0 };
  if (k === 'hurt') hero.anim = { row: 2, f: 0 };
}

function update() {
  hero.t++;
  const busy = hero.dead || (hero.anim && hero.anim.row !== 3 && hero.anim.row === 2);
  hero.vx = busy ? 0 : (keys.right ? 1.4 : 0) - (keys.left ? 1.4 : 0);
  if (hero.vx) hero.face = Math.sign(hero.vx);
  if (keys.jump && hero.onGround && !hero.dead) { hero.vy = -4; hero.onGround = false; }
  hero.vy += 0.2;
  hero.x = Math.max(-6, Math.min(W - F + 6, hero.x + hero.vx));
  const prevBottom = hero.y + F;
  hero.y += hero.vy; hero.onGround = false;
  if (hero.y + F >= GROUND) { hero.y = GROUND - F; hero.vy = 0; hero.onGround = true; }
  for (const p of platforms) {
    if (hero.vy >= 0 && prevBottom <= p.y && hero.y + F >= p.y && hero.x + 22 > p.x && hero.x + 10 < p.x + p.w) {
      hero.y = p.y - F; hero.vy = 0; hero.onGround = true;
    }
  }
  if (hero.anim && hero.t % 6 === 0) {
    hero.anim.f++;
    if (hero.anim.f > 3) hero.anim = hero.anim.row === 3 ? { row: 3, f: 3 } : null;
  }
}

function draw() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#1b1530'); sky.addColorStop(0.6, '#4a2a44'); sky.addColorStop(1, '#8a4a3a');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffffff55';
  for (let i = 0; i < 30; i++) ctx.fillRect((i * 97) % W, (i * 53) % 60, 1, 1);
  ctx.fillStyle = '#2a1e36';
  for (let x = 0; x < W; x += 4) ctx.fillRect(x, 96 + Math.round(Math.sin(x / 30) * 10 + Math.sin(x / 11) * 3), 4, 80);
  ctx.fillStyle = '#4a3a2c'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#6a5640'; ctx.fillRect(0, GROUND, W, 2);
  for (const p of platforms) {
    ctx.fillStyle = '#6a5640'; ctx.fillRect(p.x, p.y, p.w, 6);
    ctx.fillStyle = '#3a2c22'; ctx.fillRect(p.x, p.y + 4, p.w, 2);
  }
  if (!hero.c) return;
  ctx.fillStyle = '#00000066';
  ctx.fillRect(Math.round(hero.x) + 9, (hero.onGround ? hero.y + F : GROUND) - 1, 14, 2);
  let row = 0, col = Math.floor(hero.t / 10) % 4;
  if (hero.anim) { row = hero.anim.row; col = hero.anim.f; }
  else if (!hero.onGround) { row = 1; col = 2; }
  frame(ctx, hero.c, row, col, hero.x, hero.y, hero.face > 0);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
</script>
